<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="348" height="461" viewBox="0 0 348 461" role="img"
     aria-labelledby="title desc">
    <title id="title">Hook order</title>
    <desc id="desc">beforeEach, then the test. For each measure the test runs beforeWarmup, one batch and afterWarmup,
        then batches until the measure is over. A batch runs beforeIteration, callback and afterIteration N times
        between beforeBatch and afterBatch. Finally afterEach.
    </desc>
    <style>
        svg { color: #727a82; }
        text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 14px; fill: currentColor; }
        path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .each { color: #8f61d3; }
        .warmup { color: #c15d11; }
        .batch { color: #397aca; }
        .iteration { color: #2c8b36; }
        .test { stroke-width: 2; stroke-dasharray: 0 5; }
    </style>

    <!-- test box, its top edge leaves a gap for the title -->
    <path class="test"
          d="M78 36 H340 A6 6 0 0 1 346 42 V420 A6 6 0 0 1 340 426 H26 A6 6 0 0 1 20 420 V42 A6 6 0 0 1 26 36 H32"/>
    <text x="38" y="41">Test</text>

    <!-- before/after hook pairs -->
    <path class="each" d="M14 10 H7 A5 5 0 0 0 2 15 V447 A5 5 0 0 0 7 452 H14"/>
    <path class="warmup" d="M68 88 H61 A5 5 0 0 0 56 93 V239 A5 5 0 0 0 61 244 H68"/>
    <path class="batch" d="M86 114 H79 A5 5 0 0 0 74 119 V213 A5 5 0 0 0 79 218 H86"/>
    <path class="iteration" d="M104 140 H97 A5 5 0 0 0 92 145 V187 A5 5 0 0 0 97 192 H104"/>
    <path class="batch" d="M86 296 H79 A5 5 0 0 0 74 301 V395 A5 5 0 0 0 79 400 H86"/>
    <path class="iteration" d="M104 322 H97 A5 5 0 0 0 92 327 V369 A5 5 0 0 0 97 374 H104"/>

    <text x="20" y="15" class="each">beforeEach</text>
    <text x="38" y="67">For each measure</text>
    <text x="74" y="93" class="warmup">beforeWarmup</text>
    <text x="92" y="119" class="batch">beforeBatch</text>
    <text x="110" y="145" class="iteration">beforeIteration</text>
    <text x="110" y="171">callback</text>
    <text x="250" y="171">× N</text>
    <text x="110" y="197" class="iteration">afterIteration</text>
    <text x="92" y="223" class="batch">afterBatch</text>
    <text x="74" y="249" class="warmup">afterWarmup</text>
    <text x="56" y="275">Repeat until the measure is over</text>
    <text x="92" y="301" class="batch">beforeBatch</text>
    <text x="110" y="327" class="iteration">beforeIteration</text>
    <text x="110" y="353">callback</text>
    <text x="250" y="353">× N</text>
    <text x="110" y="379" class="iteration">afterIteration</text>
    <text x="92" y="405" class="batch">afterBatch</text>
    <text x="20" y="457" class="each">afterEach</text>
</svg>